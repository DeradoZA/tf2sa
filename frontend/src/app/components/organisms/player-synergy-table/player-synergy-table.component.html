<mat-card class="splits-card">
	<mat-card-header>
		<mat-card-title>{{ title }}</mat-card-title>
	</mat-card-header>

	<mat-card-content>
		<table mat-table [dataSource]="rows" class="splits-table">
			<ng-container matColumnDef="profilePicture">
				<th mat-header-cell *matHeaderCellDef style="width: 50px"></th>
				<td mat-cell style="width: 50px" *matCellDef="let row">
					<img src="{{ row.avatar }}" />
				</td>
			</ng-container>

			<ng-container matColumnDef="playerName">
				<th mat-header-cell *matHeaderCellDef>Player</th>
				<td mat-cell *matCellDef="let row">
					<a
						class="player-link"
						[routerLink]="['/players', row.steamId]"
					>
						{{ row.playerName }}
					</a>
				</td>
			</ng-container>

			<ng-container matColumnDef="numberOfGames">
				<th mat-header-cell *matHeaderCellDef>Games together</th>
				<td mat-cell *matCellDef="let row">{{ row.numberOfGames }}</td>
			</ng-container>

			<ng-container matColumnDef="winPercentage">
				<th mat-header-cell *matHeaderCellDef>Win %</th>
				<td mat-cell *matCellDef="let row">
					{{ row.winPercentage ?? "-" }}
				</td>
			</ng-container>

			<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
			<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
		</table>
	</mat-card-content>
</mat-card>
