<div class="player-page">
	<mat-progress-bar *ngIf="!isLoaded" mode="indeterminate"></mat-progress-bar>

	<app-error-banner
		*ngIf="errorMessage"
		[errorMessage]="errorMessage"
	></app-error-banner>

	<app-error-banner
		*ngIf="notFound"
		errorMessage="No games recorded for this player."
	></app-error-banner>

	<ng-container *ngIf="detail?.summary as summary">
		<app-stats-header
			[title]="summary.playerName ?? 'Unknown player'"
			[imagePath]="
				summary.avatar ?? 'assets/svg-icons/icons8-steam-circled.svg'
			"
			[isPlaceholder]="!summary.avatar"
		></app-stats-header>

		<mat-card class="summary-card">
			<div class="summary-row">
				<div class="summary-stat">
					<span class="value">{{ summary.numberOfGames }}</span>
					<span class="label">Games</span>
				</div>
				<div class="summary-stat">
					<span class="value"
						>{{ summary.winPercentage ?? "-" }}%</span
					>
					<span class="label">Win rate</span>
				</div>
				<div class="summary-stat">
					<span class="value">{{ summary.averageDpm ?? "-" }}</span>
					<span class="label">Damage / min</span>
				</div>
				<div class="summary-stat">
					<span class="value">{{ summary.averageKills ?? "-" }}</span>
					<span class="label">Kills / game</span>
				</div>
				<div class="summary-stat">
					<span class="value">{{
						summary.averageDeaths ?? "-"
					}}</span>
					<span class="label">Deaths / game</span>
				</div>
				<div class="summary-stat">
					<span class="value">
						{{ summary.wins }}-{{ summary.draws }}-{{
							summary.losses
						}}
					</span>
					<span class="label">W-D-L</span>
				</div>
			</div>
		</mat-card>

		<app-progression-chart
			[series]="chartSeries"
			[careerValues]="careerValues"
			[bucket]="bucket"
			(bucketChange)="onBucketChange($event)"
			[classOptions]="classOptions"
			[classId]="classId"
			(classIdChange)="onClassChange($event)"
		></app-progression-chart>

		<app-player-class-splits-table
			[classSplits]="detail!.classSplits"
		></app-player-class-splits-table>
	</ng-container>
</div>
