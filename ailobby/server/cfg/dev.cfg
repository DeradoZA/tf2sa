// Development / experimentation testbed. LAN-only, cheats on — do NOT exec this
// on the public VPS. Gives you the tools to iterate on bot behaviour fast.

sv_lan 1                     // local only: no Steam auth / GSLT / quickplay
sv_cheats 1                  // unlocks the dev toolkit below
mp_disable_respawn_times 0
mp_timelimit 0               // don't let the map cycle while you're iterating
mp_waitingforplayers_cancel 1

// Bot debug overlays (see them in-game with the developer console / spectator):
//   tf_bot_debug 1              per-bot state text
//   nb_debug <flags>            next-bot navigation debug (path, look, etc.)
//   bot_stop 1                  freeze all bots (great for setting up scenarios)
//   tf_bot_kill all             clear the field
//   nav_edit 1                  inspect / hand-fix the nav mesh
//   getpos / setpos             capture and teleport to positions for scenarios
//   record <name> / stop        record a demo of a run for later review
//   spec_mode / spec_next       spectate specific bots

echo "[ailobby] dev testbed loaded (sv_cheats 1, sv_lan 1)"
