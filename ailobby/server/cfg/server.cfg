// TF2SA AI Lobby — base server config.
// RCON password / server password / start map are injected by the container
// entrypoint from env (SRCDS_RCONPW, SRCDS_PW, SRCDS_STARTMAP) — don't set here.

hostname "TF2SA AI Lobby [PoC]"
sv_lan 0
sv_contact "tf2sa.co.za"

// Remote logging → AI Director (UDP). The director configures logaddress itself
// over RCON on startup (srcds drops loopback log packets in this build; it uses
// the host IP instead). We just enable logging here.
log on
sv_logecho 0
sv_logfile 1
// On the VPS, uncomment and set to the same value as LOG_SECRET in .env:
// sv_logsecret 0

exec ailobby.cfg
