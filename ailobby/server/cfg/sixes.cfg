// 6v6 testbed roster + competitive-ish settings.
// exec this (or set SRCDS_STARTMAP to a comp map and exec via server.cfg) when
// you want a 6s game instead of the casual koth default.
//
// Stock TF2 has no clean "6s class limit" cvar, so we control the roster
// manually: quota 0 + explicit tf_bot_add per class. Re-exec to reset roster.

tf_bot_quota 0
tf_bot_quota_mode normal
tf_bot_difficulty 2          // hard; the discipline/movement layers ride on top later

mp_autoteambalance 0         // never let the game shuffle bots mid-test
mp_teams_unbalance_limit 0
mp_tournament 0              // skip ready-up; we force the roster ourselves
mp_scrambleteams_auto 0
mp_respawnwavetime 6         // roughly comp-ish; tune per map
tv_enable 0
sv_alltalk 0

// --- 6s roster: 2 scout / 2 soldier / 1 demo / 1 medic per team ---
// tf_bot_add <count> <class> <team> <difficulty>
tf_bot_add 2 scout red hard
tf_bot_add 2 soldier red hard
tf_bot_add 1 demoman red hard
tf_bot_add 1 medic red hard

tf_bot_add 2 scout blue hard
tf_bot_add 2 soldier blue hard
tf_bot_add 1 demoman blue hard
tf_bot_add 1 medic blue hard

echo "[ailobby] 6v6 roster loaded (2/2/1/1 per team)"
