// AI Lobby game mode settings — stock TFBots fill the server.

tf_bot_quota 12               // 6v6 when empty; fill drops bots as humans join
tf_bot_quota_mode fill
tf_bot_difficulty 2           // hard-ish baseline; control layers ride on top later
tf_bot_join_after_player 0    // bots populate immediately

mp_autoteambalance 1          // keep teams even
mp_teams_unbalance_limit 1
mp_waitingforplayers_cancel 1 // CRITICAL: without this, bots freeze in spawn on a fresh boot
mp_timelimit 0                // don't cycle off koth_viaduct (nav-good map); pin it
tv_enable 0
sv_alltalk 0
mp_idledealmethod 0

echo "[ailobby] game mode config loaded (6v6 fill, waiting-for-players cancelled)"
