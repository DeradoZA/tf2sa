[project]
name = "ailobby-director"
version = "0.1.0"
description = "AI Director: gives TF2 bots a human-feeling voice via LLM-generated team chat"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ailobby_director"]

[tool.setuptools.package-data]
ailobby_director = ["personas.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
